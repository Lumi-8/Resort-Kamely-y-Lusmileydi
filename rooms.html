        <!-- Contenedor de la Experiencia Interactiva -->
        <!-- Contenedor de la Experiencia Interactiva -->
<!-- Contenedor de la Experiencia Interactiva -->
<div class="interactive-showcase" id="showcase">

    <!-- El Cajón del Carrusel va primero para controlar el flujo de CSS con ~ -->
    <div class="carousel-drawer" id="carousel-drawer">
        <div class="preview-carousel">
            <!-- Card 1 -->
            <div class="room-card" onclick="updateSuite(this, 0)">

                <div class="card-info"><h3>Suite Presidencial</h3></div>
            </div>
            <!-- Card 2 -->
            <div class="room-card" onclick="updateSuite(this, 1)">
                <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?q=80&w=600" alt="">
                <div class="card-info"><h3>Habitación Ejecutiva</h3></div>
            </div>
            <!-- Card 3 -->
            <div class="room-card" onclick="updateSuite(this, 2)">
                <img src="https://images.unsplash.com/photo-1591088398332-8a7791972843?q=80&w=600" alt="">
                <div class="card-info"><h3>Master Suite</h3></div>
            </div>
        </div>
    </div>
    
    <!-- Panel de Detalles (Abajo en el HTML, pero se posiciona a la izquierda con CSS) -->

        <span class="sub-tag">Experiencia K'logicks</span>
        <h2 id="room-title"></h2>
        <p id="room-desc"></p>
        <span class="room-price-tag" id="room-price"></span>
        <div class="amenities-container" id="amenities-box"></div>
    </div>

</div>
