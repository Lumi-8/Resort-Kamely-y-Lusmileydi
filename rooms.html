<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K'logicks Luxury - Habitaciones</title>
    <link rel="stylesheet" href="static/css/rooms.css">
</head>
<body>

    <!-- Fondo Inmersivo Completo -->
    <div class="main-bg" id="bg-premium"></div>

    <div class="content-wrapper">
        <!-- Navbar Minimalista (Solo Hamburguesa) -->
        <header class="main-navbar">
            <nav class="nav-container">
                <!-- Botón Hamburguesa solo -->
                <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <!-- Enlaces de Navegación Desplegables -->
                <div class="nav-links" id="nav-links">
                    <a href="index.html">Inicio</a>
                    <a href="#" class="active">Habitaciones</a>
                    <a href="#">Restaurantes</a>
                    <a href="#">Experiencias</a>
                </div>
            </nav>
        </header>

        <!-- Contenedor de la Experiencia Interactiva -->
        <div class="interactive-showcase" id="showcase">

            <!-- El Cajón del Carrusel -->
            <div class="carousel-drawer" id="carousel-drawer">
               <button class="toggle-carousel-btn" id="toggle-carousel-btn" aria-label="Expandir carrusel">
        <span class="arrow-icon">◀</span>
    </button>
                <div class="preview-carousel">
                    <div class="room-card" onclick="updateSuite(this, 0)">
                        <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427?q=80&w=600" alt="">
                        <div class="card-info"><h3>Suite Presidencial</h3></div>
                    </div>
                    <div class="room-card" onclick="updateSuite(this, 1)">
                        <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?q=80&w=600" alt="">
                        <div class="card-info"><h3>Habitación Ejecutiva</h3></div>
                    </div>
                    <div class="room-card" onclick="updateSuite(this, 2)">
                        <img src="https://images.unsplash.com/photo-1591088398332-8a7791972843?q=80&w=600" alt="">
                        <div class="card-info"><h3>Master Suite</h3></div>
                    </div>
                </div>
            </div>
            
            <!-- Panel de Detalles Cinematográfico -->
            <div class="room-details-panel" id="details-panel">
                <span class="sub-tag">Experiencia K'logicks</span>
                <h2 id="room-title"></h2>
                <p id="room-desc"></p>
                <span class="room-price-tag" id="room-price"></span>
                <div class="amenities-container" id="amenities-box"></div>
                
                <button class="btn-reserve-room" id="btn-reserve">Reservar Habitación</button>
            </div>

        </div>
    </div>

    <script src="static/js/rooms.js"></script>
</body>
</html>
